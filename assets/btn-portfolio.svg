<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="4" y="4" width="292" height="56" rx="28"/></clipPath>
<filter id="gl" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect x="8" y="10" width="284" height="48" rx="24" fill="#22d3ee" filter="url(#gl)"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="4" y="4" width="292" height="56" rx="28" fill="url(#bg)"/>

<g clip-path="url(#c)"><rect x="-90" y="0" width="70" height="64" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-120;380" dur="3.2s" repeatCount="indefinite"/></rect></g>
<text x="150" y="39" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="3" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#04121a">VIEW PORTFOLIO</text>
</svg>