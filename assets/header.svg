<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
<defs>
<clipPath id="rc"><rect width="1000" height="300" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#0f1a2e"/></linearGradient>
<linearGradient id="ng" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="800" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#34d399"/><stop offset="1" stop-color="#818cf8"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#818cf8" stop-opacity="0.33"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
<radialGradient id="o3"><stop offset="0" stop-color="#34d399" stop-opacity="0.28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/></pattern>
<style>
.name{font:800 68px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:url(#ng);fill-opacity:0;stroke:url(#ng);stroke-width:1.4;stroke-dasharray:3200;stroke-dashoffset:3200;animation:draw 3.2s ease-out .3s forwards,fillin 1s ease 2.5s forwards}
.sub{font:600 19px 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace;fill:#e2e8f0;opacity:0;letter-spacing:22px;animation:sub 1.6s ease 2.4s forwards}
.tag{font:500 15px 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace;fill:#94a3b8;opacity:0;animation:fade 1.2s ease 3.4s forwards}
.ph{font:700 120px 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace;fill:#fff;opacity:.04;animation:float 7s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
@keyframes sub{to{opacity:1;letter-spacing:9px}}
@keyframes fade{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
</style>
</defs>
