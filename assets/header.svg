.n2{font:900 88px 'Arial Black','Helvetica Neue',Arial,sans-serif;fill:none;stroke:#f3ead8;stroke-width:2;transform:translateY(110px);animation:up 1s cubic-bezier(.2,.8,.2,1) .5s forwards}
.lb{font:700 13px 'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace;fill:#f2b134;letter-spacing:6px;opacity:0;animation:fd 1s ease 1.1s forwards}
.co{font:500 12px 'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace;fill:#8c8173;letter-spacing:3px;opacity:0;animation:fd 1s ease 1.5s forwards}
.bar{transform-origin:40px 60px;transform:scaleX(0);animation:sx 1s ease .1s forwards}
