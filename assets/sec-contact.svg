<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<style>
.n{font:700 14px 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace;fill:#22d3ee;opacity:0;animation:in .8s ease .1s forwards}
.t{font:800 28px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#e2e8f0;letter-spacing:6px;opacity:0;animation:in .9s ease .3s forwards}
.ln{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 1.6s ease .6s forwards}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes dr{to{stroke-dashoffset:0}}
</style></defs>
<text class="n" x="4" y="22">05 /</text>
<text class="t" x="4" y="52">CONTACT</text>
<line class="ln" x1="0" y1="62" x2="900" y2="62" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
<circle cy="62" r="4" fill="#34d399"><animate attributeName="cx" values="0;900;0" dur="6s" repeatCount="indefinite"/></circle>
</svg>